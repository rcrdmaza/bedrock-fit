<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="design_doc_mode" content="canvas">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#EDEFEA;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:#4A8F1E;text-decoration:none;}
  a:hover{color:#2C2F33;}
</style>
</helmet>

<section style="padding:64px 48px 80px;">
  <div style="max-width:1080px;margin:0 auto;">

    <div style="margin-bottom:44px;">
      <div style="font:600 13px 'Space Grotesk';letter-spacing:0.18em;text-transform:uppercase;color:#4A8F1E;margin-bottom:12px;">Direction C · Ascend</div>
      <h1 style="margin:0;font:900 48px/1.02 'Archivo';letter-spacing:-0.03em;color:#1E2124;">bedrock<span style="color:#7FBF3A;">.fit</span></h1>
      <p style="margin:14px 0 0;max-width:560px;font:400 16px/1.5 'Space Grotesk';color:#5A5F63;">A green arrow rising over a white one, off a solid base line — grounded strength driving upward speed.</p>
    </div>

    <!-- Bezeled hero -->
    <div style="border-radius:36px;padding:14px;background:linear-gradient(145deg,#34383D,#15181B);box-shadow:0 32px 64px -20px rgba(0,0,0,0.55),inset 0 2px 0 rgba(255,255,255,0.10);">
      <div style="border-radius:26px;padding:56px;background:radial-gradient(120% 120% at 30% 20%,#26292D 0%,#1B1E21 70%);box-shadow:inset 0 2px 3px rgba(255,255,255,0.08),inset 0 -6px 18px rgba(0,0,0,0.55),inset 0 0 0 1px rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;">
        <div style="width:240px;height:240px;filter:drop-shadow(0 10px 22px rgba(0,0,0,0.45));">
          <dc-import name="Mark" variant="c" struct="#F2F4EF" accent="#A8E063" hint-size="240px,240px"></dc-import>
        </div>
      </div>
    </div>

    <!-- Lockups -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;">
      <div style="border-radius:22px;padding:40px 36px;background:#23262A;display:flex;align-items:center;gap:18px;box-shadow:0 16px 32px -18px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.06);">
        <div style="width:64px;height:64px;flex:none;"><dc-import name="Mark" variant="c" struct="#F2F4EF" accent="#A8E063" hint-size="64px,64px"></dc-import></div>
        <span style="font:800 38px 'Archivo';letter-spacing:-0.03em;color:#F2F4EF;line-height:1;">bedrock<span style="color:#A8E063;">.fit</span></span>
      </div>
      <div style="border-radius:22px;padding:40px 36px;background:#FFFFFF;display:flex;align-items:center;gap:18px;box-shadow:0 16px 32px -18px rgba(0,0,0,0.18),inset 0 0 0 1px #E4E6E0;">
        <div style="width:64px;height:64px;flex:none;"><dc-import name="Mark" variant="c" struct="#2C2F33" accent="#7FBF3A" hint-size="64px,64px"></dc-import></div>
        <span style="font:800 38px 'Archivo';letter-spacing:-0.03em;color:#1E2124;line-height:1;">bedrock<span style="color:#7FBF3A;">.fit</span></span>
      </div>
    </div>

    <!-- App icons w/ bezel -->
    <div style="margin-top:36px;">
      <div style="font:500 11px 'Space Grotesk';letter-spacing:0.14em;text-transform:uppercase;color:#8A8F94;margin-bottom:16px;">App icon · bezel treatment</div>
      <div style="display:flex;gap:22px;flex-wrap:wrap;">
        <div style="width:132px;">
          <div style="aspect-ratio:1;border-radius:28px;padding:8px;background:linear-gradient(145deg,#34383D,#141719);box-shadow:0 18px 30px -14px rgba(0,0,0,0.55),inset 0 2px 0 rgba(255,255,255,0.10);">
            <div style="width:100%;height:100%;border-radius:21px;background:radial-gradient(120% 120% at 30% 20%,#26292D,#1B1E21);box-shadow:inset 0 2px 3px rgba(255,255,255,0.08),inset 0 -5px 14px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;">
              <div style="width:62%;height:62%;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.45));"><dc-import name="Mark" variant="c" struct="#F2F4EF" accent="#A8E063" hint-size="72px,72px"></dc-import></div>
            </div>
          </div>
        </div>
        <div style="width:132px;">
          <div style="aspect-ratio:1;border-radius:28px;padding:8px;background:linear-gradient(145deg,#BEEE7C,#7CB53A);box-shadow:0 18px 30px -14px rgba(90,130,40,0.5),inset 0 2px 0 rgba(255,255,255,0.35);">
            <div style="width:100%;height:100%;border-radius:21px;background:radial-gradient(120% 120% at 30% 20%,#B6E86F,#98D64F);box-shadow:inset 0 2px 3px rgba(255,255,255,0.4),inset 0 -5px 14px rgba(90,130,40,0.35);display:flex;align-items:center;justify-content:center;">
              <div style="width:62%;height:62%;filter:drop-shadow(0 5px 10px rgba(60,90,20,0.4));"><dc-import name="Mark" variant="c" struct="#1E2124" accent="#1E2124" hint-size="72px,72px"></dc-import></div>
            </div>
          </div>
        </div>
        <div style="width:132px;">
          <div style="aspect-ratio:1;border-radius:28px;padding:8px;background:linear-gradient(145deg,#FFFFFF,#DDE0D9);box-shadow:0 18px 30px -14px rgba(0,0,0,0.2),inset 0 2px 0 rgba(255,255,255,0.9);">
            <div style="width:100%;height:100%;border-radius:21px;background:#FFFFFF;box-shadow:inset 0 -5px 14px rgba(0,0,0,0.08),inset 0 0 0 1px #E4E6E0;display:flex;align-items:center;justify-content:center;">
              <div style="width:62%;height:62%;"><dc-import name="Mark" variant="c" struct="#2C2F33" accent="#7FBF3A" hint-size="72px,72px"></dc-import></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
